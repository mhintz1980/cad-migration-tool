# Example CAD Standards Configuration
# Copy this file and customize for your organization

name: "modern-standards"
version: "2.0"
description: "Modern corporate CAD standards"
drawing_type: "mechanical"

# Layer Standards
# Define properties for each standard layer
layer_standards:
  GEOMETRY:
    name: GEOMETRY
    color: 7  # White (AutoCAD color index)
    linetype: "Continuous"
    lineweight: 0.25  # mm
    description: "Geometric entities (lines, arcs, circles)"

  DIMENSIONS:
    name: DIMENSIONS
    color: 1  # Red
    linetype: "Continuous"
    lineweight: 0.18
    description: "Dimension entities"

  TEXT:
    name: TEXT
    color: 3  # Green
    linetype: "Continuous"
    lineweight: 0.13
    description: "Text and annotations"

  CENTERLINES:
    name: CENTERLINES
    color: 5  # Blue
    linetype: "CENTER"
    lineweight: 0.13
    description: "Centerlines and axis"

  HIDDEN:
    name: HIDDEN
    color: 8  # Dark gray
    linetype: "HIDDEN"
    lineweight: 0.18
    description: "Hidden lines"

  HATCHING:
    name: HATCHING
    color: 9  # Light gray
    linetype: "Continuous"
    lineweight: 0.13
    description: "Section hatching"

# Dimension Standards
# Define dimension style properties
dimension_standards:
  default:
    arrow_size: 0.18  # mm
    text_height: 0.125  # mm
    text_offset: 0.09  # mm from dimension line
    extension_line_offset: 0.0625  # mm from origin
    precision: 2  # decimal places
    units: "mm"
    layer: "DIMENSIONS"
    arrow_style: "CLOSED"  # CLOSED, OPEN, DOT, etc.
    text_alignment: "ABOVE"  # ABOVE, CENTER, OUTSIDE

# Text Standards
# Define text style properties
text_standards:
  default:
    height: 0.125  # mm
    font: "Arial"
    layer: "TEXT"
    alignment: "LEFT"  # LEFT, CENTER, RIGHT
    
  title:
    height: 0.25
    font: "Arial"
    layer: "TEXT"
    alignment: "CENTER"
    
  notes:
    height: 0.1
    font: "Arial"
    layer: "TEXT"
    alignment: "LEFT"

# Layer Mappings
# Map old layer names to new standard names
layer_mapping:
  # Common standard layers
  "0": "GEOMETRY"
  "DEFPOINTS": "GEOMETRY"
  "Defpoints": "GEOMETRY"
  "DIMS": "DIMENSIONS"
  "DIM": "DIMENSIONS"
  "NOTES": "TEXT"
  "TEXT": "TEXT"
  "CENTER": "CENTERLINES"
  "CENTERLINE": "CENTERLINES"
  "HIDDEN": "HIDDEN"
  "HATCH": "HATCHING"

  # CNC/downloaded file layers (for learning demo)
  "Holes": "GEOMETRY"
  "Grille": "GEOMETRY"
  "Box": "GEOMETRY"
  "Layer_1": "GEOMETRY"
  "Layer 1": "GEOMETRY"
  "1": "GEOMETRY"
  "freepatternsarea.com": "TEXT"

# Title Block Field Mappings
# Map old title block fields to new fields
title_block_mappings:
  "DWG_NO": "number"
  "DRAWING_NO": "number"
  "PART_NO": "number"
  "TITLE": "title"
  "DWG_TITLE": "title"
  "DRAWN_BY": "author"
  "DESIGNER": "author"
  "CHECKED_BY": "checker"
  "DATE": "date"
  "DWG_DATE": "date"
  "REV": "revision"
  "REVISION": "revision"
  "SCALE": "scale"

# Property Mappings for PDM Integration
# Map CAD properties to PDM custom properties
property_mappings:
  PartNumber:
    property_name: "PartNumber"
    source: "title_block"
    source_key: "number"
    data_type: "string"
    required: true

  Title:
    property_name: "Title"
    source: "title_block"
    source_key: "title"
    data_type: "string"
    required: true

  Author:
    property_name: "Author"
    source: "title_block"
    source_key: "author"
    data_type: "string"
    required: false

  Revision:
    property_name: "Revision"
    source: "title_block"
    source_key: "revision"
    data_type: "string"
    required: false

  Date:
    property_name: "Date"
    source: "title_block"
    source_key: "date"
    data_type: "string"
    required: false

# Validation Rules
validation:
  # Required layers that must exist
  # (RELAXED for learning - commented out)
  # required_layers:
  #   - "GEOMETRY"
  #   - "DIMENSIONS"

  # Minimum entity counts
  min_entities: 0  # Changed to 0 to allow any drawing

  # Title block required fields
  # (RELAXED for learning - commented out)
  # required_title_block_fields:
  #   - "number"
  #   - "title"
